<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Materials - KV The Study Hub</title>

  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <meta
    name="description"
    content="Download subject-wise notes from KV The Study Hub."
  >

  <meta
    name="keywords"
    content="study materials, tuition notes, KV The Study Hub"
  >

  <meta
    name="author"
    content="KV The Study Hub"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#1E3A8A',
            accentGold: '#F59E0B'
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif']
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-white text-slate-800 antialiased">

  <a href="#main-content" class="skip-link">
    Skip to main content
  </a>

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200">

    <nav
      class="container mx-auto px-4 sm:px-6 lg:px-8"
      aria-label="Main navigation"
    >

      <div class="flex h-16 items-center justify-between">

        <a
          href="index.html"
          class="text-lg font-semibold text-brandBlue"
        >
          KV The Study Hub
        </a>

        <button
          id="menu-toggle"
          type="button"
          class="inline-flex items-center justify-center rounded-md p-2 text-brandBlue md:hidden"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Toggle navigation menu"
        >

          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 6h18M3 12h18M3 18h18"
            ></path>
          </svg>

        </button>

        <ul class="hidden items-center gap-7 md:flex">

          <li>
            <a href="index.html" class="nav-link">
              Home
            </a>
          </li>

          <li>
            <a href="materials.html" class="nav-link">
              Materials
            </a>
          </li>

          <li>
            <a href="contact.html" class="nav-link">
              Contact
            </a>
          </li>

        </ul>

      </div>

      <div
        id="mobile-menu"
        class="hidden border-t border-slate-200 py-3 md:hidden"
      >

        <ul class="space-y-2">

          <li>
            <a href="index.html" class="mobile-nav-link">
              Home
            </a>
          </li>

          <li>
            <a href="materials.html" class="mobile-nav-link">
              Materials
            </a>
          </li>

          <li>
            <a href="contact.html" class="mobile-nav-link">
              Contact
            </a>
          </li>

        </ul>

      </div>

    </nav>

  </header>

  <!-- MAIN -->
  <main id="main-content">

    <!-- HERO -->
    <section class="bg-slate-50 py-14 sm:py-16">

      <div class="container mx-auto px-4 sm:px-6 lg:px-8">

        <div class="mx-auto max-w-3xl text-center">

          <h1 class="text-3xl font-bold text-brandBlue sm:text-4xl">
            Study Materials - KV The Study Hub
          </h1>

          <p class="mt-4 text-slate-600">
            Download curated notes prepared for students enrolled in our coaching classes in Kolkata.
          </p>

        </div>

      </div>

    </section>

    <!-- MATERIALS -->
    <section class="py-14 sm:py-16">

      <div class="container mx-auto px-4 sm:px-6 lg:px-8">

        <div
          id="materials-container"
          class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"
        >
        </div>

      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-200 bg-white py-6">

    <div
      class="container mx-auto px-4 text-center text-sm text-slate-500 sm:px-6 lg:px-8"
    >

      <p>
        &copy;
        <span id="year"></span>
        KV The Study Hub.
        All rights reserved.
      </p>

      <p class="mt-1">
        Built by Takumi Labs
      </p>

    </div>

  </footer>

  <!-- MAIN JS -->
  <script src="assets/js/main.js"></script>

  <!-- DYNAMIC MATERIALS -->
  <script>

    async function loadMaterials() {

      const response = await fetch('materials.json');

      const data = await response.json();

      const container = document.getElementById('materials-container');

      data.materials.forEach(item => {

        container.innerHTML += `

          <article class="notes-card">

            <h2 class="card-title">
              ${item.title}
            </h2>

            <p class="card-text mt-3">
              ${item.description}
            </p>

            <a
              href="${item.pdf}"
              target="_blank"
              class="btn-secondary mt-5 inline-flex"
            >
              Download
            </a>

          </article>

        `;

      });

    }

    loadMaterials();

  </script>

</body>
</html>
