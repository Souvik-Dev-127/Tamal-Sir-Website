backend:
  name: git-gateway
  branch: main

media_folder: "notes"
public_folder: "/notes"

collections:
  - name: "materials"
    label: "Study Materials"
    folder: "materials"
    create: true

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - { label: "PDF", name: "pdf", widget: "file" }